name: Проверки демо на 360 px

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dekanych
          POSTGRES_USER: dekanych
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dekanych"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dekanych@localhost:5432/dekanych
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Линтер и типы
        run: |
          npm run lint
          npm run typecheck
      - name: Модульные тесты
        run: npx tsx --test tests/unit/*.test.ts
      - name: Подготовка тестовой базы
        run: |
          printf 'SESSION_SECRET=%s\nSEED_PASSWORD=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npm run test:e2e
