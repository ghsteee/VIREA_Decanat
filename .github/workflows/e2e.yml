name: Проверки демо на 360 px

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dekanych
          POSTGRES_USER: dekanych
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dekanych"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dekanych@localhost:5432/dekanych
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Линтер и типы
        run: |
          npm run lint
          npm run typecheck
      - name: Модульные тесты
        run: npm run test:unit
      - name: Подготовка тестовой базы
        run: |
          session_secret="$(openssl rand -hex 32)"
          seed_password="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$session_secret" "$seed_password"
          printf 'SESSION_SECRET=%s\nSEED_PASSWORD=%s\n' "$session_secret" "$seed_password" >> "$GITHUB_ENV"
          npm run db:deploy
      - run: npm run db:seed
      - name: Проверка очереди на тестовой базе
        run: npm run test:integration
        env:
          INTEGRATION_TEST_DATABASE: "on"
      - name: Тестовые ключи push
        run: |
          node -e 'const k = require("web-push").generateVAPIDKeys(); for (const [name, value] of Object.entries({VAPID_PUBLIC_KEY:k.publicKey,VAPID_PRIVATE_KEY:k.privateKey,VAPID_SUBJECT:"mailto:test@example.test"})) { console.log("::add-mask::"+value); require("node:fs").appendFileSync(process.env.GITHUB_ENV,name+"="+value+"\n"); }'
      - run: npm run build
      - run: npm run test:e2e
